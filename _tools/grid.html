<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>html,body{margin:0;background:#000}#g{display:grid;grid-template-columns:repeat(3,360px);grid-auto-rows:640px}video{width:360px;height:640px;object-fit:cover;display:block}</style></head><body><div id="g"></div>
<script>
const q=new URLSearchParams(location.search),src=q.get('src'),ts=(q.get('ts')||'1,3,6,9,13,18').split(',').map(Number),g=document.getElementById('g');
ts.forEach(t=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=src;v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.min(t,v.duration-0.2);});v.addEventListener('seeked',()=>v.pause());g.append(v);});
</script></body></html>
