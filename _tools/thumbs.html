<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>html,body{margin:0;background:#000;color:#f00;font:14px monospace}#g{display:grid;grid-template-columns:repeat(3,360px);grid-auto-rows:640px}#g div{position:relative;width:360px;height:640px;overflow:hidden}img{width:360px;height:640px;object-fit:cover;display:block}span{position:absolute;left:4px;top:4px}</style></head><body><div id="g"></div>
<script>
const ids=(new URLSearchParams(location.search).get('ids')||'').split(','),g=document.getElementById('g');
ids.forEach(async id=>{const d=document.createElement('div');g.append(d);
 try{const r=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent('https://www.tiktok.com/@common_threadd/video/'+id));const j=await r.json();const im=new Image();im.src=j.thumbnail_url;d.append(im);}
 catch(e){d.innerHTML='<span>ERR '+id+' '+e+'</span>';}});
</script></body></html>
