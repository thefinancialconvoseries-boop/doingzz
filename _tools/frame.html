<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>html,body{margin:0;height:100%;background:#000}video{width:100vw;height:100vh;object-fit:cover;display:block}#s{position:fixed;left:0;bottom:0;color:#000;font:8px monospace}</style></head><body>
<video id="v" muted playsinline preload="auto"></video><div id="s">loading</div>
<script>
const q=new URLSearchParams(location.search),v=document.getElementById('v'),s=document.getElementById('s');
v.src=q.get('src');const t=parseFloat(q.get('t')||'1');
v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.min(t,v.duration-0.1);});
v.addEventListener('seeked',()=>{v.pause();s.textContent='ready';});
v.addEventListener('error',()=>{s.textContent='error';s.style.color='#f00';s.style.font='40px sans-serif';});
</script></body></html>
